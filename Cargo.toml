[package]
name = "tomatask"
version = "0.1.0"
edition = "2024"

[lib]
name = "tomatask_core"
path = "src/lib.rs"

[[bin]]
name = "tomatask"
path = "src/bin/tomatask.rs"

[[bin]]
name = "tomataskd"
path = "src/bin/tomataskd.rs"

[[bin]]
name = "tomatask-status"
path = "src/bin/tomatask_status.rs"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
iced = { version = "0.12", features = ["tokio"] }
notify-rust = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
